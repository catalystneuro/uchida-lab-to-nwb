[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uchida-lab-to-nwb"
version = "0.0.1"
description = "NWB conversion scripts, functions, and classes for Uchida Lab"
readme = "README.md"
authors = [{ name = "CatalystNeuro", email = "alessandra.trapani@catalystneuro.com" }]
maintainers = [{ name = "CatalystNeuro", email = "alessandra.trapani@catalystneuro.com" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pynwb>=4.0.0",
    "nwbinspector",
    # DANNCEInterface is on neuroconv add-dannce-interface
    "neuroconv @ git+https://github.com/catalystneuro/neuroconv.git@add-dannce-interface",
    # "ndx-pose>=0.4.0", # release TBD
    "ndx-pose @ git+https://github.com/rly/ndx-pose.git@main",
    "ndx-fiber-photometry",
    "ndx-ophys-devices>=0.3.1",
    "openpyxl",
    "python-dateutil",
    "opencv-python-headless",
]

[project.urls]
Repository = "https://github.com/catalystneuro/uchida-lab-to-nwb"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/uchida_lab_to_nwb"]

[tool.hatch.build.targets.sdist]
include = ["src/"]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

