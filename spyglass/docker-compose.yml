# Local Spyglass MySQL database for the Uchida lab (DANDI:001935) ingestion.
#
# Runs alongside the Gonzalez-Sulser database (container `spyglass-db`, port 3306,
# volume `spyglass-mysql-data`) without touching it: this one has its own container
# name, its own named volume, and host port 3307.
#
# Image: datajoint/mysql (pre-configures the mysql_native_password auth plugin so
# PyMySQL/DataJoint connect without extra flags). Tag 8.0 matches the MySQL version
# current DataJoint (>=0.14) expects.
#
# Storage: the MySQL data directory lives in a Docker *named volume*, NOT a bind
# mount to F:. The F: external disk is exFAT, which has no POSIX permissions or file
# locking and would corrupt InnoDB. The named volume is stored inside the Docker
# Desktop WSL2 VM (ext4).
#
#   Start:        docker compose up -d
#   Status:       docker compose ps
#   Stop:         docker compose stop
#   Wipe DB:      docker compose down -v   (deletes ONLY this project's named volume)

name: spyglass-uchida

services:
  db:
    image: datajoint/mysql:8.0
    container_name: spyglass-uchida-db
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=tutorial   # must match dj_local_conf.json
    volumes:
      - spyglass-uchida-mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  spyglass-uchida-mysql-data:
